name: Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backend:
        description: "PyTorch backend extra to build into the image"
        required: true
        default: "cu128"
        type: choice
        options:
          - cu128
          - rocm
          - cpu

env:
  REGISTRY: ghcr.io
  DEFAULT_BACKEND: cu128

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          backend="${{ github.event.inputs.backend || env.DEFAULT_BACKEND }}"
          git fetch --no-tags origin main
          tag="$(TZ=Asia/Tokyo git log origin/main -1 --date=format-local:%Y%m%d-%H%M --format=%cd)"

          echo "name=${REGISTRY}/${repository}" >> "${GITHUB_OUTPUT}"
          echo "backend=${backend}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.title=Irodori OpenAI TTS Server
            org.opencontainers.image.description=OpenAI-compatible inference API server for Irodori-TTS

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            IRODORI_TTS_BACKEND=${{ steps.image.outputs.backend }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
